name: voxel_game_minecraft
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.23.0
  hooks: ^2.2.0
  vector_math: ^2.4.2
  voxel_engine: ^0.4.0-dev
  voxel_game: ^0.4.0-dev
  voxel_scene: ^0.4.0-dev
  web_crashlytics:
    path: ../../../../fog/web_crashlytics.dart/web_crashlytics

# The kit from this tree, never pub.dev's: this app witnesses a kit change before it is
# published (KL-006). Overrides, not path dependencies, because the kit's packages depend
# on each other as hosted; the ranges above say which kit this app is written against.
dependency_overrides:
  sound_recipes:
    path: ../../packages/sound_recipes
  voxel_engine:
    path: ../../packages/voxel_engine
  voxel_game:
    path: ../../packages/voxel_game
  voxel_scene:
    path: ../../packages/voxel_scene

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  gamepads: ^0.1.10

flutter:
  assets:
    - flutter_scene_generated/
    - assets/audio/footstep/forest/
    - assets/audio/footstep/desert/
    - assets/audio/footstep/snow/
    - assets/audio/footstep/swamp/
    - assets/audio/footstep/lava/
    - assets/audio/music/ # <track>.mp3, all optional (assets/audio/music/README.md)
    - ROADMAP.md # stage 30: the credits read the stage table at runtime
  uses-material-design: true
