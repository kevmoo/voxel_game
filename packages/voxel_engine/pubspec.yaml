name: voxel_engine
description: >-
  The pure-Dart half of the voxel kit: chunk grid, meshing, streaming, physics,
  world generation, block and item content, signals and a TCP net layer.
version: 0.5.0-dev
homepage: https://github.com/fluttely/voxel_game
repository: https://github.com/fluttely/voxel_game/tree/main/packages/voxel_engine
issue_tracker: https://github.com/fluttely/voxel_game/issues
topics:
  - voxel
  - game-engine
  - procedural-generation
  - physics
  - networking

environment:
  sdk: ^3.13.0

resolution: workspace

# No Flutter SDK dependency, on purpose: a Flutter import here fails to resolve,
# and the whole engine stays runnable in `dart test` and on worker isolates.
dependencies:
  meta: ^1.15.0
  vector_math: ^2.1.4
  web: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
